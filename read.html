<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Đọc sách</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  body.th-dark { background: #121417; color: #cfd3d8; }
  body.th-sepia { background: #f4ecd8; color: #5b4636; }
  body.th-light { background: #fbfbfb; color: #222; }
  body.serif #content { font-family: Georgia, "Times New Roman", serif; }

  #page { cursor: pointer; min-height: 100%; }
  #content { max-width: 760px; margin: 0 auto; padding: 36px 30px 90px; line-height: 1.65; font-size: 20px; word-wrap: break-word; }
  #content img { max-width: 100%; height: auto; display: block; margin: 12px auto; }
  #content h1 { font-size: 1.5em; line-height: 1.3; } #content h2 { font-size: 1.3em; line-height: 1.3; } #content h3 { font-size: 1.15em; }
  #content p { margin: 0 0 0.9em; }
  #content blockquote { margin: 1em 0 1em 1em; padding-left: 1em; border-left: 3px solid rgba(128,128,128,.4); }
  #content table { border-collapse: collapse; } #content td, #content th { border: 1px solid rgba(128,128,128,.4); padding: 4px 6px; }
  #content pre { white-space: pre-wrap; }
  #content.pdf { max-width: none; padding: 0 0 60px; }
  #content.pdf img.pg { width: 100%; margin: 0; background: #fff; min-height: 300px; }
  .endmark { text-align: center; opacity: .45; font-size: 15px; margin-top: 40px; }

  #back { position: fixed; top: 10px; left: 10px; z-index: 4; height: 40px; line-height: 40px; padding: 0 14px; border-radius: 20px;
          background: rgba(30,33,38,.75); color: #fff; text-decoration: none; font-size: 16px; }
  #back:active { background: rgba(60,66,76,.9); }
  body.ui #back { display: none; }
  #hint { position: fixed; left: 50%; bottom: 30px; width: 340px; margin-left: -170px; padding: 12px; border-radius: 10px; background: rgba(0,0,0,.8);
          color: #fff; font-size: 15px; text-align: center; z-index: 6; -webkit-transition: opacity .5s; transition: opacity .5s; pointer-events: none; }
  .bar { position: fixed; left: 0; right: 0; background: rgba(22,24,28,.97); color: #e8e8e8; z-index: 5; display: none; overflow: hidden; }
  body.ui .bar { display: block; }
  #top { top: 0; height: 56px; line-height: 56px; padding: 0 10px; text-align: center; }
  #top .l { float: left; } #top .r { float: right; }
  #title { display: block; margin: 0 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; font-weight: 600; }
  #bot { bottom: 0; padding: 10px; }
  .b { display: inline-block; color: #fff; text-decoration: none; font-size: 16px; padding: 0 14px; height: 40px; line-height: 40px; border-radius: 8px; background: #2d333b; margin-right: 6px; }
  #top .b { margin: 8px 0 0; }
  #where { font-size: 14px; color: #9aa3ad; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #prog { height: 4px; background: #2d333b; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  #prog div { height: 4px; background: #4caf50; width: 0; }
  #pct { float: right; font-size: 14px; color: #9aa3ad; line-height: 40px; }

  #toc { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #16181c; color: #e8e8e8; z-index: 8; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
  #toc h2 { margin: 0; padding: 16px; font-size: 18px; border-bottom: 1px solid #2a2f36; }
  #toc h2 a { float: right; margin-top: -8px; }
  #toc a.it { display: block; padding: 16px; border-bottom: 1px solid #22262c; color: #e8e8e8; text-decoration: none; font-size: 17px; }
  #toc a.it.cur { color: #5fa8ff; font-weight: 600; }
  #loading { position: fixed; top: 45%; left: 0; right: 0; text-align: center; font-size: 16px; opacity: .6; display: none; }
  #pinbox { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #14161a; color: #fff; padding-top: 120px; text-align: center; z-index: 9; }
  #pinbox input { font-size: 32px; width: 220px; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid #444; background: #1f2329; color: #fff; letter-spacing: 8px; }
  #pinbox button { display: block; margin: 18px auto 0; font-size: 20px; padding: 12px 50px; border: 0; border-radius: 10px; background: #2f6fe4; color: #fff; }
</style>
</head>
<body class="th-dark">

<div id="page"><div id="content"></div></div>
<a id="back" href="/books">&lsaquo; Thư viện</a>
<div id="hint">Chạm bên phải / trái để lật trang<br>Chạm giữa màn hình để mở menu</div>

<div id="top" class="bar">
  <a class="b l" href="/books">&lsaquo; Thư viện</a>
  <a class="b r" href="#" id="tocBtn">Mục lục</a>
  <span id="title"></span>
</div>
<div id="bot" class="bar">
  <span id="pct">0%</span>
  <span id="textBtns"><a class="b" href="#" id="fMinus">A&minus;</a><a class="b" href="#" id="fPlus">A+</a><a class="b" href="#" id="fFace">Kiểu chữ</a></span><a class="b" href="#" id="theme">Nền</a>
  <div id="where"></div>
  <div id="prog"><div></div></div>
</div>

<div id="toc"><h2><a class="b" href="#" id="tocClose">Đóng</a><span id="tocHead">Mục lục</span></h2><div id="tocList"></div></div>
<div id="loading">Đang tải...</div>

<div id="pinbox">
  <h1>Nhập mã PIN</h1>
  <input id="pin" type="tel" maxlength="12">
  <button id="pinok">OK</button>
</div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function tap(el, fn) { el.onclick = function (e) { e.preventDefault(); e.stopPropagation(); fn(); }; }

  var id = (location.search.match(/[?&]id=([0-9a-f]+)/) || [])[1];
  var pin = get('pcremote_pin', '');
  function setCookie() { document.cookie = 'pcpin=' + encodeURIComponent(pin) + '; path=/; max-age=31536000'; }
  if (pin) setCookie();

  var info = null, ch = 0, busy = false, restoreTok = 0;
  var font = +get('reader_font', 20), theme = get('reader_theme', 'dark'), serif = get('reader_serif', '0') === '1';
  var THEMES = ['dark', 'sepia', 'light'];

  function applyLook() {
    var ui = document.body.className.indexOf('ui') >= 0;
    document.body.className = 'th-' + theme + (serif ? ' serif' : '') + (ui ? ' ui' : '');
    $('content').style.fontSize = font + 'px';
  }

  function xhr(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.setRequestHeader('X-Pin', pin);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 401) { $('pinbox').style.display = 'block'; return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      if (cb) cb(x.status === 200 ? d : null);
    };
    x.send(body ? JSON.stringify(body) : null);
  }

  function docH() { return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); }
  function maxY() { return Math.max(0, docH() - window.innerHeight); }
  function frac() { var m = maxY(); return m ? Math.min(1, window.pageYOffset / m) : 0; }
  function atBottom() { return window.pageYOffset >= maxY() - 4; }

  function restore(f) {
    var tok = ++restoreTok;
    function go() { if (tok === restoreTok) window.scrollTo(0, Math.round(f * maxY())); }
    go(); setTimeout(go, 300); setTimeout(go, 1200);
  }

  function openCh(n, f) {
    if (!info || busy || n < 0 || n >= info.total) return;
    busy = true;
    $('loading').style.display = 'block';
    function done(html) {
      busy = false;
      $('loading').style.display = 'none';
      if (html === null) { $('content').innerHTML = '<p>Không tải được phần này.</p>'; return; }
      ch = n;
      $('content').innerHTML = html + (n === info.total - 1 ? '<div class="endmark">— Hết sách —</div>' : '');
      window.scrollTo(0, 0);
      restore(f || 0);
      updateBar();
      savePos();
    }
    if (info.type === 'pdf') {
      var w = Math.min(1600, Math.round(window.innerWidth * (window.devicePixelRatio || 1)));
      var src = function (k) { return '/api/books/' + id + '/page/' + k + '?w=' + w; };
      if (n + 1 < info.total) { var pre = new Image(); pre.src = src(n + 1); }
      done('<img class="pg" src="' + src(n) + '">');
    } else {
      xhr('GET', '/api/books/' + id + '/ch/' + n, null, function (d) { done(d ? d.html : null); });
    }
  }

  function next() {
    if (atBottom()) openCh(ch + 1, 0);
    else { restoreTok++; window.scrollBy(0, window.innerHeight - 60); }
  }
  function prev() {
    if (window.pageYOffset <= 2) openCh(ch - 1, 1);
    else { restoreTok++; window.scrollBy(0, -(window.innerHeight - 60)); }
  }

  function chapterName() {
    if (info.type === 'pdf') return 'Trang ' + (ch + 1) + ' / ' + info.total;
    var t = null;
    for (var i = 0; i < info.toc.length; i++) if (info.toc[i].ch <= ch) t = info.toc[i].title;
    return (t ? t + ' · ' : '') + 'Phần ' + (ch + 1) + ' / ' + info.total;
  }
  function updateBar() {
    if (!info) return;
    var p = Math.min(100, Math.round(100 * (ch + frac()) / info.total));
    $('pct').innerHTML = p + '%';
    $('prog').firstChild.style.width = p + '%';
    $('where').innerHTML = esc(chapterName());
  }

  var saveTimer = null;
  function savePos() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      xhr('POST', '/api/books/' + id + '/pos', { ch: ch, frac: Math.round(frac() * 1000) / 1000 });
    }, 800);
  }
  window.addEventListener('scroll', function () { updateBar(); savePos(); }, false);

  // Cham trai: trang truoc · cham phai: trang sau · cham giua: hien/an thanh cong cu
  $('page').onclick = function (e) {
    var ui = document.body.className.indexOf(' ui') >= 0;
    if (ui) { document.body.className = document.body.className.replace(' ui', ''); return; }
    var x = e.clientX / window.innerWidth;
    if (x < 0.3) prev();
    else if (x > 0.7) next();
    else { document.body.className += ' ui'; updateBar(); }
  };

  tap($('fMinus'), function () { font = Math.max(14, font - 2); put('reader_font', font); applyLook(); });
  tap($('fPlus'), function () { font = Math.min(40, font + 2); put('reader_font', font); applyLook(); });
  tap($('fFace'), function () { serif = !serif; put('reader_serif', serif ? '1' : '0'); applyLook(); });
  tap($('theme'), function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; put('reader_theme', theme); applyLook();
  });

  function showToc() {
    var html = '', i, items = info.toc;
    if (info.type === 'pdf') {
      html += '<a class="it" href="#" data-go="ask">Đi tới trang...</a>';
    } else if (!items.length) {
      items = [];
      for (i = 0; i < info.total; i++) items.push({ ch: i, title: 'Phần ' + (i + 1) });
    }
    for (i = 0; i < items.length; i++) {
      var cur = items[i].ch <= ch && (i === items.length - 1 || items[i + 1].ch > ch);
      html += '<a class="it' + (cur ? ' cur' : '') + '" href="#" data-go="' + items[i].ch + '">' + esc(items[i].title) +
        (info.type === 'pdf' ? ' <span style="opacity:.5">· tr. ' + (items[i].ch + 1) + '</span>' : '') + '</a>';
    }
    $('tocList').innerHTML = html;
    $('toc').style.display = 'block';
  }
  $('tocList').onclick = function (e) {
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-go')) el = el.parentNode;
    if (!el || el === this) return;
    e.preventDefault();
    var g = el.getAttribute('data-go');
    if (g === 'ask') {
      var v = parseInt(window.prompt('Đi tới trang (1 - ' + info.total + '):', ch + 1), 10);
      if (!v) return;
      g = Math.max(1, Math.min(info.total, v)) - 1;
    }
    $('toc').style.display = 'none';
    document.body.className = document.body.className.replace(' ui', '');
    openCh(+g, 0);
  };
  tap($('tocBtn'), showToc);
  tap($('tocClose'), function () { $('toc').style.display = 'none'; });

  function start() {
    if (!id) { $('content').innerHTML = '<p>Thiếu mã sách. <a href="/books">Về thư viện</a></p>'; return; }
    xhr('GET', '/api/books/' + id + '/info', null, function (d) {
      if (!d || d.mode !== 'reader') { $('content').innerHTML = '<p>Không mở được sách này. <a href="/books">Về thư viện</a></p>'; return; }
      info = d;
      document.title = d.title;
      $('title').innerHTML = esc(d.title);
      if (d.type === 'pdf') { $('textBtns').style.display = 'none'; $('theme').style.display = 'none'; $('content').className = 'pdf'; }
      var p = d.pos;
      openCh(p ? Math.min(p.ch, d.total - 1) : 0, p ? p.frac : 0);
    });
  }
  $('pinok').onclick = function () {
    pin = $('pin').value; put('pcremote_pin', pin); setCookie();
    $('pinbox').style.display = 'none';
    start();
  };

  applyLook();
  start();
  setTimeout(function () { $('hint').style.opacity = '0'; }, 3500);
  setTimeout(function () { $('hint').style.display = 'none'; }, 4200);
})();
</script>
</body>
</html>
